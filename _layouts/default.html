<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .wrapper {
      display: flex;
      min-height: 100vh;
    }
    aside {
      width: 240px;
      padding: 20px;
      border-right: 1px solid #ddd;
      box-sizing: border-box;
    }
    main {
      flex: 1;
      padding: 24px;
      box-sizing: border-box;
    }
    aside a {
      display: block;
      margin-bottom: 12px;
      text-decoration: none;
      font-weight: 600;
    }
    img {
      max-width: 100%;
      height: auto;
    }
    @media (max-width: 768px) {
      .wrapper {
        display: block;
      }
      aside {
        width: auto;
        border-right: none;
        border-bottom: 1px solid #ddd;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <aside>
      <h3>Navigation</h3>
      <a href="{{ '/' | relative_url }}">🏠 Index</a>
      <a href="{{ '/images/' | relative_url }}">🖼 Images</a>
      <a href="{{ '/english/' | relative_url }}">🌐 English version</a>
    </aside>
    <main>
      {{ content }}
    </main>
  </div>
</body>
</html>
